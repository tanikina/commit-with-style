[project]
name = "commit-with-style"
version = "0.1.0"
description = "Commit-message completion prototype: prompting strategies + LoRA fine-tuning, evaluated with LLM-as-judge and METEOR/ChrF/BERTScore"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.13",
    "sacrebleu>=2.6",
    "nltk>=3.10",
    "bert-score>=0.3.13",
    "torch>=2.6.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=1.2.0",
    "vllm>=0.8.4; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
grazie = ["grazie_api_gateway_client>=0.3.3"]
qlora = ["bitsandbytes>=0.43"]  # needed for --load-in-4bit (training) and --quantization
                                 # bitsandbytes (vllm inference) alike; untested on the local 4GB GPU
vllm = ["vllm"]  # GPU-only; pins its own exact torch version, verified compatible with the
                 # torch>=2.13,<2.14 pin above at install time (vllm==0.28.0 -> torch==2.13.0)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commit_style*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
